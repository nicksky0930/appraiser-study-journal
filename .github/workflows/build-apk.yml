name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "估價師學習日記_Android專案_v08.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip "估價師學習日記_Android專案_v08.zip" -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd project/估價師學習日記_Android專案
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: appraiser-study-journal-apk
          path: project/估價師學習日記_Android專案/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
